<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA">
<title>The Way · 道</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23C8452C'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white'%3E%E9%81%93%3C/text%3E%3C/svg%3E">
<style>:root{--ac:#1D7898;--ac2:#E0784E;--ink:#1E2733;--mut:#6B7480;--bg:#F4F1EA;--card:#FFFDF8;--line:#E6E0D4;--bad:#B93A2E;
--serif:"Noto Serif",Georgia,serif;--sans:system-ui,Roboto,sans-serif;--mono:ui-monospace,"Roboto Mono",monospace;
--acs:color-mix(in srgb,var(--ac) 12%,#fff);--ac2s:color-mix(in srgb,var(--ac2) 14%,#fff)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);padding-bottom:calc(92px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.hidden{display:none!important}
body.lite *,body.lite *::before,body.lite *::after{animation:none!important;transition:none!important}

/* header */
.hd{position:relative;height:290px;overflow:hidden;background:var(--line)}
.hd.short{height:190px}
.hd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom}
.hd-top{position:relative;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 16px 0}
.stamp{display:flex;align-items:center;gap:10px}
.stamp b{width:34px;height:34px;border-radius:6px;background:#C8452C;color:#fff;font-family:var(--serif);font-size:21px;font-weight:600;display:grid;place-items:center;transform:rotate(-4deg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.stamp span{font-family:var(--serif);font-size:15px;letter-spacing:.4px}
.hbtn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.55);display:grid;place-items:center}
.hbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.hd-main{position:relative;padding:10px 20px 0}
.hd .clk{font-family:var(--serif);font-size:58px;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.hd .sub{font-size:14px;margin-top:7px;opacity:.85}
.hd .ttl{font-family:var(--serif);font-size:34px;line-height:1.1;margin-top:4px}
.hd.dark{color:#fff}
.hd.dark .clk,.hd.dark .ttl,.hd.dark .sub,.hd.dark .stamp span{text-shadow:0 1px 6px rgba(0,0,0,.35)}
.hd.dark .hbtn{background:rgba(0,0,0,.22)}
.pv{display:inline-block;font:600 11px var(--sans);background:var(--ac2);color:#fff;border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:middle;text-shadow:none}

.wrap{padding:0 14px;position:relative;margin-top:-56px;max-width:640px;margin-left:auto;margin-right:auto}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(30,39,51,.08);margin-bottom:12px;border:1px solid rgba(0,0,0,.03)}
.card.tap{cursor:pointer}
.lbl{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);font-weight:600}
.h2{font-family:var(--serif);font-size:22px;margin-top:4px;line-height:1.25;overflow-wrap:anywhere}
.h3{font-family:var(--serif);font-size:18px;line-height:1.3;overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.sp{flex:1;min-width:0}
.mut{color:var(--mut)}
.sm{font-size:12.5px;color:var(--mut)}
.bad{color:var(--bad)!important;font-weight:600}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--acs);color:var(--ac);font-weight:600;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis;flex:none}
.chip.a2{background:var(--ac2s);color:var(--ac2)}
.chip.g{background:#EEEAE2;color:var(--mut)}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;max-width:100%}
.bar i.a2{background:var(--ac2)}
.bar i.over{background:var(--bad)}
.btn{border:0;border-radius:12px;padding:11px 14px;font:600 14px var(--sans);background:var(--ac);color:#fff;min-height:44px}
.btn.g{background:transparent;color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 35%,#fff)}
.btn.d{background:transparent;color:var(--bad);border:1px solid #E8C4BF}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btns .btn{flex:1}
.link{color:var(--ac);font-weight:600;font-size:13px;padding:6px 0}
.empty{text-align:center;padding:10px 4px;color:var(--mut);font-size:14px}
.empty .btn{margin-top:10px}

/* focus goal + route */
.route{position:relative;height:30px;margin:14px 7px 0}
.route .ln{position:absolute;left:0;right:0;top:13px;height:2px;background:var(--line)}
.route .ln i{display:block;height:100%;background:var(--ac)}
.route .m{position:absolute;top:7px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--card);border:2px solid var(--line)}
.route .m.on{border-color:var(--ac);background:var(--ac)}
.route .m.cur{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 20%,transparent)}
.rlab{position:relative;height:18px;margin:0 7px;font-size:11px;color:var(--mut)}
.rlab span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.rlab span.f{transform:translateX(-7px);text-align:left}
.rlab span.l{transform:translateX(calc(-100% + 7px));text-align:right}
.rlab span.cur{color:var(--ink);font-weight:600}

/* rings */
.rings{display:flex;gap:10px;margin-top:10px}
.rings>button{flex:1;text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center}
.ring svg{display:block}
.ring-sub{font-size:12.5px;color:var(--mut);margin-top:4px;line-height:1.35}

/* now strip */
.strip{display:flex;align-items:center;gap:12px}
.strip .vl{width:3px;align-self:stretch;border-radius:3px;background:var(--ac);flex:none}
.big{font-family:var(--mono);font-size:20px;color:var(--ac);white-space:nowrap}

/* lists */
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);min-height:48px}
.li:last-child{border-bottom:0}
.li .main{flex:1;min-width:0;cursor:pointer}
.li .t{font-size:15px;overflow-wrap:anywhere}
.li.dn .t{color:var(--mut);text-decoration:line-through}
.ck{width:24px;height:24px;border-radius:7px;border:1.6px solid #B9C0C8;flex:none;position:relative;background:var(--card)}
.ck.on{background:var(--ac);border-color:var(--ac)}
.ck.on::after{content:"";position:absolute;left:7.5px;top:3px;width:5px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.ck.round{border-radius:50%}
.pd{width:8px;height:8px;border-radius:50%;flex:none;background:#C9C3B6}
.pd.p2{background:var(--ac)}.pd.p3{background:var(--ac2)}
.sec{margin:6px 0 2px;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut);font-weight:600}
.sec.bad{color:var(--bad)}
.gl{padding:10px 0;cursor:pointer}
.gl+.gl{border-top:1px solid var(--line)}
.star{color:var(--ac2);font-size:14px}
.seg{display:flex;background:#EEEAE2;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mut);min-height:36px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dots{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line)}
.dots i.on{background:var(--ac);border-color:var(--ac)}
.dots i.na{border-style:dashed;opacity:.5}
.dots i.today{outline:2px solid color-mix(in srgb,var(--ac) 30%,transparent);outline-offset:1px}
.mnav{display:flex;align-items:center;justify-content:space-between}
.mnav button{width:44px;height:44px;border-radius:50%;font-size:22px;color:var(--ac)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px}
.kv b{font-weight:600}
.xrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;min-height:48px}
.xrow:last-child{border-bottom:0}
.amt{font-family:var(--mono);white-space:nowrap}

/* banners */
.banner{background:#FFF4E0;border:1px solid #F0D7A8;color:#6B4B12;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13.5px;display:flex;align-items:center;gap:10px}
.banner .btn{min-height:36px;padding:7px 12px;font-size:13px;flex:none}
.banner.info{background:var(--acs);border-color:color-mix(in srgb,var(--ac) 25%,#fff);color:var(--ink)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(68px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mut);flex:1;min-width:0;padding:6px 0}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ac);font-weight:600}
.fabw{flex:1;display:flex;justify-content:center}
.fab{width:58px;height:58px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;margin-top:-30px;box-shadow:0 4px 12px rgba(0,0,0,.18);border:4px solid var(--bg)}
.fab svg{width:26px;height:26px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round}

/* sheets */
.sw{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(20,26,34,.42);animation:fade .2s ease}
.sheet{position:relative;background:var(--bg);border-radius:22px 22px 0 0;max-height:92vh;display:flex;flex-direction:column;animation:up .22s ease;padding-bottom:env(safe-area-inset-bottom);max-width:640px;width:100%;margin:0 auto}
.grab{width:40px;height:4px;border-radius:4px;background:#CFC8BA;margin:8px auto 0}
.sh-head{display:flex;align-items:center;gap:10px;padding:10px 16px 8px}
.sh-head h3{flex:1;font-family:var(--serif);font-size:20px;font-weight:500;min-width:0;overflow-wrap:anywhere}
.x{width:40px;height:40px;border-radius:50%;background:#EEEAE2;font-size:18px;color:var(--mut);flex:none}
.sh-body{overflow-y:auto;padding:4px 16px 20px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* forms */
.fld{margin-top:12px}
.fld>label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:5px;letter-spacing:.3px}
.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font-size:16px;min-height:46px;outline:none}
.in:focus{border-color:var(--ac)}
textarea.in{min-height:84px;resize:vertical;line-height:1.4}
.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:8px 12px;border-radius:99px;background:#EEEAE2;font-size:13px;font-weight:600;color:var(--mut);min-height:36px}
.chips button.on{background:var(--ac);color:#fff}
.tog{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
.tog .sw2{width:44px;height:26px;border-radius:99px;background:#D6D0C4;position:relative;flex:none;transition:background .15s}
.tog .sw2::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.tog.on .sw2{background:var(--ac)}
.tog.on .sw2::after{transform:translateX(18px)}
.hint{font-size:12px;color:var(--mut);margin-top:5px}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:0}
.group{background:var(--card);border-radius:16px;padding:4px 14px 12px;margin-top:12px;border:1px solid rgba(0,0,0,.04)}
.group>.lbl{padding-top:12px}
.srow{display:flex;align-items:center;gap:8px;margin-top:8px}
.srow .in{min-height:42px;padding:8px 10px}
.mini{width:42px;height:42px;border-radius:10px;background:#EEEAE2;color:var(--mut);flex:none;font-size:16px}
pre.diag{white-space:pre-wrap;word-break:break-word;font:12px var(--mono);background:#EEEAE2;border-radius:10px;padding:10px;max-height:200px;overflow:auto;margin-top:8px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}

/* sync status dot */
.sdot{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.12);padding:0;margin-left:2px}
.sdot.s-ok{background:#3E9C5A}
.sdot.s-busy{background:var(--ac2)}
.sdot.s-off{background:#B9C0C8}
.sdot.s-offline{background:#9AA3AD}
.sdot.s-pin,.sdot.s-locked,.sdot.s-setup,.sdot.s-error,.sdot.s-server,.sdot.s-foreign,.sdot.s-bad,.sdot.s-noserver{background:var(--bad)}
.stamp .sdot{position:relative}
.stamp .sdot::before{content:"";position:absolute;inset:-14px}

/* ===== watch view (round screen, sized in vmin so any watch size works) ===== */
#watch{display:none}
body.watch{background:#0E131B;padding:0;min-height:0;overflow:hidden;font-size:5.6vmin;color:#EEF2F5}
body.watch .hd,body.watch .wrap,body.watch .tabs{display:none!important}
body.watch #watch{display:block;position:fixed;inset:0;--wbg:#0E131B;--wcard:#1A222D;--wline:#2A3440;--wmut:#93A0AD;--wink:#EEF2F5}
body.watch #toast{bottom:16vmin;font-size:4.6vmin;padding:2.4vmin 4vmin;max-width:72vmin;border-radius:5vmin;background:#EEF2F5;color:#0E131B}
.wv{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.wv::-webkit-scrollbar{display:none}
.wc{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:17vmin 9vmin 28vmin}
.wc.mid{justify-content:center;padding:0 10vmin}
.wlab{font-size:3.9vmin;letter-spacing:.35vmin;text-transform:uppercase;color:var(--wmut);font-weight:600;text-align:center}
.wbig{font-family:var(--serif);font-size:7.4vmin;line-height:1.15;text-align:center;max-width:66vmin;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.wsub{font-size:4.4vmin;color:var(--wmut);text-align:center;margin-top:1vmin}
.wtop{position:absolute;top:5.5vmin;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:1.6vmin;font:600 4.4vmin var(--mono);color:var(--wmut);padding:1.5vmin 3vmin;border-radius:5vmin;z-index:2}
.wtop .sdot{width:2.6vmin;height:2.6vmin;border-width:0;box-shadow:none;margin:0}
.wring{position:absolute;inset:0;pointer-events:none}
.wbtns{display:flex;gap:3.4vmin;margin-top:4.6vmin}
.wrb{width:16.5vmin;height:16.5vmin;border-radius:50%;background:var(--wcard);display:grid;place-items:center;color:var(--wink);font:700 6vmin var(--sans)}
.wrb svg{width:7.6vmin;height:7.6vmin;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.wrb.hot{background:var(--wac2);color:#0E131B}
.wrb.hot svg{stroke-width:2.6}
.wbtn{background:var(--wac);color:#0E131B;border-radius:7vmin;font:700 5.2vmin var(--sans);min-height:12.5vmin;padding:0 6vmin;display:flex;align-items:center;justify-content:center;margin-top:4vmin}
.wbtn.g{background:var(--wcard);color:var(--wink);border:1px solid var(--wline)}
.wbtn.a2{background:var(--wac2)}
.wbtn.d{background:transparent;color:#F28B7D;border:1px solid #5A2F2B}
.wbtn:disabled{opacity:.45}
.whead{font-size:4.1vmin;letter-spacing:.3vmin;text-transform:uppercase;color:var(--wmut);font-weight:600;padding:2vmin 4vmin;min-height:10vmin;display:flex;align-items:center;gap:1.4vmin}
.whead b{font-size:6vmin;line-height:1;font-weight:400;margin-top:-.6vmin}
.wrow{width:80vmin;min-height:15vmin;background:var(--wcard);border-radius:5vmin;display:flex;align-items:center;gap:3vmin;padding:2vmin 4vmin;margin-top:2.4vmin;text-align:left;color:var(--wink);font-size:5.4vmin;line-height:1.2}
.wrow .t{flex:1;min-width:0;overflow-wrap:anywhere}
.wrow .s{display:block;font-size:3.8vmin;color:var(--wmut);margin-top:.4vmin}
.wrow.dn .t{color:var(--wmut);text-decoration:line-through}
.wck{width:7.4vmin;height:7.4vmin;border-radius:50%;border:.7vmin solid #4A5562;flex:none;position:relative}
.wck.sq{border-radius:2vmin}
.wck.on{background:var(--wac);border-color:var(--wac)}
.wck.on::after{content:"";position:absolute;left:1.9vmin;top:.6vmin;width:1.6vmin;height:3.4vmin;border:solid #0E131B;border-width:0 .7vmin .7vmin 0;transform:rotate(45deg)}
.wsec{margin-top:4.4vmin;font-size:3.7vmin;letter-spacing:.3vmin;text-transform:uppercase;color:var(--wmut);font-weight:600}
.wsec.bad{color:#F28B7D}
.wempty{color:var(--wmut);font-size:4.8vmin;text-align:center;margin-top:5vmin;max-width:70vmin}
.wamt{font:600 9vmin var(--mono);margin:0 0 2.4vmin;white-space:nowrap}
.wamt i{font-style:normal;color:var(--wmut);font-size:6vmin}
.wpad{display:grid;grid-template-columns:repeat(4,15vmin);gap:2vmin}
.wpad button{height:12vmin;border-radius:4vmin;background:var(--wcard);color:var(--wink);font:600 6vmin var(--mono)}
.wpad button.sm{font-size:4.4vmin}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:2.4vmin;width:78vmin;margin-top:3vmin}
.wgrid button{min-height:14vmin;border-radius:5vmin;background:var(--wcard);color:var(--wink);font:600 4.8vmin var(--sans);padding:1vmin 2vmin;overflow-wrap:anywhere}
.wkv{display:flex;justify-content:space-between;width:70vmin;font-size:4.8vmin;padding:1.2vmin 0;border-bottom:1px solid var(--wline)}
.wkv:last-child{border-bottom:0}
.wkv b{font-family:var(--mono);font-weight:600}
.wbad{color:#F28B7D!important}
.wdots{display:flex;gap:3vmin;margin:1vmin 0 3vmin}
.wdots i{width:4.4vmin;height:4.4vmin;border-radius:50%;border:.6vmin solid #4A5562}
.wdots i.on{background:var(--wac);border-color:var(--wac)}
.wnote{font-size:4.2vmin;color:var(--wmut);text-align:center;max-width:72vmin;margin-top:2vmin;line-height:1.35}
.wpad button[data-v=del]{font:600 6.4vmin var(--sans)}
</style></head><body>
<noscript>This tool needs JavaScript turned on.</noscript>
<script>'use strict';
/* ===== data.js — defaults, sanitizers, storage ===== */
const APP_ID = 'the-way', APP_V = 1;
const LS_KEY = 'way.v1', LS_VIS = 'way.vis', LS_DIAG = 'way.diag';
const THEME_NAMES = ['earth', 'forest', 'sea', 'wind'];

const DEF_AREAS = [{ id: 'a1', name: 'Work & career' }, { id: 'a2', name: 'Finance & learning' }];
const DEF_CATS = [['c1', 'Food'], ['c2', 'Transport'], ['c3', 'Bills'], ['c4', 'Learning'], ['c5', 'Home'], ['c6', 'Health'], ['c7', 'Fun'], ['c8', 'Other']]
  .map(([id, name]) => ({ id, name, limit: 0 }));
const DEF_RATES = { USD: 25400, EUR: 27600, JPY: 170 };

  const f = act.find(g => g.id === S.meta.focus);
  return f || act.find(g => g.star) || act[0];
}
function dowOf(k) { return parseKey(k).getDay(); }
function scheduledOn(s, k) { return !s.paused && s.days.includes(dowOf(k)); }
function isDone(s, k) { return !!(s.log[k] && s.log[k].d); }
function setDone(s, k, v) {
  const e = s.log[k] || { d: 0, s: [] }; e.d = v ? 1 : 0;
  if (!e.d && !e.s.length) delete s.log[k]; else s.log[k] = e;
}
function createdKey(ts) { return ts ? keyOf(new Date(ts)) : '1970-01-01'; }
function sysStreak(s) {
  const k = todayKey(), start = createdKey(s.created); let n = 0;
  for (let i = 0; i < 400; i++) {
    const d = addDays(k, -i);
    if (d < start && !isDone(s, d)) break;
    if (!s.days.includes(dowOf(d))) continue;
    if (isDone(s, d)) n++; else if (i === 0) continue; else break;
  }
  return n;
}
function overallStreak() {
  const k = todayKey(); let n = 0;
  const live = S.systems.filter(s => !s.paused);
  if (!live.length) return 0;
  for (let i = 0; i < 366; i++) {
    const d = addDays(k, -i);
    const due = live.filter(s => s.days.includes(dowOf(d)) && createdKey(s.created) <= d);
    if (!due.length) { if (live.every(s => createdKey(s.created) > d)) break; continue; }
    if (due.every(s => isDone(s, d))) n++; else if (i === 0) continue; else break;
  }
  return n;
}
function todayBlocks(k) {
  return S.systems.filter(s => s.time && scheduledOn(s, k))
    .map(s => ({ s, start: toMin(s.time), end: toMin(s.time) + s.dur }))
    .sort((a, b) => a.start - b.start || a.s.title.localeCompare(b.s.title));
}
function nowInfo() {
  const k = todayKey(), n = now(), nm = n.getHours() * 60 + n.getMinutes() + n.getSeconds() / 60;
  const B = todayBlocks(k);
  const man = S.meta.manual && S.meta.manual.date === k ? S.meta.manual : null;
  if (man) { const i = Math.min(man.idx, B.length); return { mode: 'manual', B, i, cur: B[i] || null, next: B[i + 1] || null, nextIdx: i + 1, nm, k }; }
  const i = B.findIndex(b => b.start <= nm && nm < b.end);
  if (i >= 0) return { mode: 'clock', B, i, cur: B[i], next: B[i + 1] || null, nextIdx: i + 1, nm, k };
  const j = B.findIndex(b => b.start > nm);
  return { mode: 'clock', B, i: -1, cur: null, next: j >= 0 ? B[j] : null, nextIdx: j, nm, k };
}
function todayStats() {
  const k = todayKey();
  const sys = S.systems.filter(s => scheduledOn(s, k));
  const sysDone = sys.filter(s => isDone(s, k)).length;
  const open = S.tasks.filter(t => !t.done && t.due && t.due <= k);
  const overdue = open.filter(t => t.due < k).length;
  const doneToday = S.tasks.filter(t => t.done && t.doneAt === k).length;
  const total = sys.length + open.length + doneToday, done = sysDone + doneToday;
  return { total, done, left: total - done, overdue };
}
function monthKey(k) { return k.slice(0, 7); }
function daysInMonth(ym) { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function monthStats(ym) {
  let spent = 0, out = 0; const byCat = {};
  for (const e of S.expenses) {
    if (!e.date.startsWith(ym)) continue;
    if (e.out) { out += e.amt; continue; }
    spent += e.amt; byCat[e.cat] = (byCat[e.cat] || 0) + e.amt;
  }
  const budget = S.settings.budget, left = budget - spent;
  const tk = todayKey(); let daysLeft = 0;
  if (monthKey(tk) === ym) daysLeft = daysInMonth(ym) - parseKey(tk).getDate() + 1;
  return { spent, out, byCat, budget, left, daysLeft, perDay: daysLeft ? Math.max(0, left) / daysLeft : 0 };
}
function goalSpent(id) { let s = 0; for (const e of S.expenses) if (e.goal === id) s += e.amt; return s; }
function daysSummary(days) {
  const k = [...days].sort().join(',');
  if (k === '0,1,2,3,4,5,6') return 'Daily';
  if (k === '1,2,3,4,5') return 'Weekdays';
  if (k === '0,6') return 'Weekends';
  return [1, 2, 3, 4, 5, 6, 0].filter(d => days.includes(d)).map(d => DOW[d]).join(' ');
}
function sysWhen(s) { return s.time ? s.time + '–' + hhmm(toMin(s.time) + s.dur) : 'Anytime'; }
function dueLabel(t) {
  if (!t.due) return { txt: 'No date', bad: false };
  const k = todayKey(), dd = diffDays(k, t.due);
  if (dd < 0 && !t.done) return { txt: 'Overdue · ' + (dd === -1 ? 'yesterday' : (-dd) + ' days'), bad: true };
  if (dd === 0) return { txt: 'Today', bad: false };
  if (dd === 1) return { txt: 'Tomorrow', bad: false };
  return { txt: fmtDay(t.due, parseKey(t.due).getFullYear() !== parseKey(k).getFullYear()), bad: false };
}

/* ---------- render ---------- */
function render() {
  try { renderAll(); }
  catch (e) {
    logDiag('render: ' + (e && e.stack ? e.stack.split('\n').slice(0, 2).join(' | ') : e));
    const wv = document.body.classList.contains('watch') && document.getElementById('watch');
    if (wv) { wv.innerHTML = `<div class="wv"><div class="wc mid"><div class="wbig">Something went wrong</div><div class="wnote">Your data is safe.</div><button class="wbtn" data-act="retry">Try again</button><button class="wbtn g" data-act="wPhone">Phone view</button></div></div>`; return; }
    const m = $('#main');
    if (m) m.innerHTML = `<div class="card" style="margin-top:70px"><div class="h3">Something went wrong…</div><p class="sm" style="margin-top:6px">Your data is safe. You can export a backup, then try again.</p><div class="btns"><button class="btn" data-act="export">Export backup</button><button class="btn g" data-act="retry">Try again</button></div><button class="link" data-act="settings">Open settings & diagnostics</button></div>`;
  }
}
function renderAll() {
  document.body.classList.toggle('lite', S.settings.lite);

  document.body.classList.toggle('watch', W);
  if (W) { renderWatch(); return; }
  renderHeader();
  const V = { today: viewToday, systems: viewSystems, tasks: viewTasks, goals: viewGoals, budget: viewBudget }[ui.tab] || viewToday;
  $('#main').innerHTML = V();
  document.querySelectorAll('.tab[data-tab]').forEach(t => t.classList.toggle('on', t.dataset.tab === ui.tab));
}

/* ----- Today ----- */
function routeHTML(g) {
  const n = g.ms.length;
  if (n < 2) return `<div class="bar"><i class="${areaCls(g.area)}" style="width:${(goalPct(g) * 100).toFixed(1)}%"></i></div><div class="sm" style="margin-top:6px">${esc(goalText(g))}</div>`;
  const doneN = g.ms.filter(m => m.done).length;
  const curI = g.ms.findIndex(m => !m.done);
  const fill = doneN === 0 ? 0 : doneN >= n ? 100 : (doneN - 1) / (n - 1) * 100;
  let dots = '', labs = '';
  // all labels only if every one fits without truncation or overlap; otherwise just the current one
  const W = Math.min(window.innerWidth || 380, 640) - 74, room = 0.62 * W / (n - 1);
  const allFit = n <= 5 && g.ms.every(m => m.t.length * 6.3 <= room);
  g.ms.forEach((m, i) => {
    const x = (i / (n - 1) * 100).toFixed(2);
    dots += `<span class="m${m.done ? ' on' : ''}${i === curI ? ' cur' : ''}" style="left:${x}%"></span>`;
    if (allFit) labs += `<span class="${i === 0 ? 'f' : i === n - 1 ? 'l' : ''}${i === curI ? ' cur' : ''}" style="left:${x}%">${esc(m.t)}</span>`;
  });

  return `<div class="route"><div class="ln"><i style="width:${fill.toFixed(1)}%"></i></div>${dots}</div>${allFit ? `<div class="rlab">${labs}</div>` : ''}` +
    (!allFit ? `<div class="sm" style="margin-top:4px">${curI >= 0 ? 'Next: ' + esc(g.ms[curI].t) + ' · ' : ''}${doneN} of ${n} milestones</div>` : '');
}

  const k = todayKey();

  const today = S.systems.filter(s => scheduledOn(s, k)).sort((a, b) => (a.time ? 0 : 1) - (b.time ? 0 : 1) || (a.time || '').localeCompare(b.time || '') || a.title.localeCompare(b.title));
  h += `<div class="card"><div class="row"><div class="lbl">Today · ${fmtDay(k)}</div><div class="sp"></div><span class="sm">${today.filter(s => isDone(s, k)).length} of ${today.length}</span></div>` +
    (today.length ? today.map(s => sysRow(s, k)).join('') : '<div class="empty">Nothing scheduled today. Enjoy the rest.</div>') + '</div>';
  const all = [...S.systems].sort((a, b) => a.paused - b.paused || (a.time || '99').localeCompare(b.time || '99'));

  return h;
}

/* ----- Tasks ----- */

}
function viewTasks() {
  let h = banners();
  h += `<div class="card" style="padding:10px"><div class="seg"><button class="${ui.taskView === 'open' ? 'on' : ''}" data-act="taskView" data-v="open">Open</button><button class="${ui.taskView === 'done' ? 'on' : ''}" data-act="taskView" data-v="done">Done</button></div></div>`;
  const k = todayKey();
  const sorter = (a, b) => (a.due || '9999').localeCompare(b.due || '9999') || b.prio - a.prio || a.created - b.created;
  if (ui.taskView === 'done') {
    const d = S.tasks.filter(t => t.done).sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || '') || b.created - a.created);
    return h + `<div class="card">${d.length ? d.slice(0, 200).map(taskRow).join('') : '<div class="empty">No finished tasks yet.</div>'}</div>`;

  if (!open.length) return h + `<div class="card"><div class="empty"><div class="h3" style="color:var(--ink)">All clear</div><p style="margin-top:6px">No open tasks. Add one with the + button.</p><button class="btn" data-act="add" data-type="task">Add a task</button></div></div>`;

}

/* ----- Goals ----- */

function viewGoals() {

}

/* ----- Budget ----- */
function viewBudget() {
  let h = banners();
  const tk = todayKey(); if (!ui.month) ui.month = monthKey(tk);
  const ym = ui.month, [y, mo] = ym.split('-').map(Number), m = monthStats(ym);
  const over = m.budget > 0 && m.spent > m.budget, p = m.budget > 0 ? m.spent / m.budget : 0;
  let yr = 0; for (const e of S.expenses) if (e.date.startsWith(String(y)) && !e.out) yr += e.amt;
  h += `<div class="card"><div class="mnav"><button data-act="month" data-d="-1" aria-label="Previous month">‹</button><div style="text-align:center"><div class="h3">${MONL[mo - 1]} ${y}</div><div class="sm">${y} so far: ${fmtShort(yr)} ₫</div></div><button data-act="month" data-d="1" aria-label="Next month">›</button></div>
    <div class="row" style="margin-top:10px;align-items:center"><div>${ring(p, over ? '#B93A2E' : THEMES[THEME].ac2, 128, m.budget > 0 ? Math.round(p * 100) + '%' : '—', 'of budget')}</div>
    <div class="sp"><div class="kv"><span class="mut">Spent</span><b class="amt">${fmtShort(m.spent)} ₫</b></div><div class="kv"><span class="mut">Budget</span><b class="amt">${fmtShort(m.budget)} ₫</b></div>
    <div class="kv"><span class="mut">${over ? 'Over' : 'Left'}</span><b class="amt ${over ? 'bad' : ''}">${fmtShort(Math.abs(m.left))} ₫</b></div>${m.daysLeft ? `<div class="kv"><span class="mut">Per day</span><b class="amt">${fmtShort(m.perDay)} ₫</b></div>` : ''}</div></div>
    <div class="btns"><button class="btn g" data-act="budgetEdit">Adjust budget</button><button class="btn" data-act="add" data-type="expense">+ Spending</button></div></div>`;
  const rows = S.cats.map(c => ({ c, v: m.byCat[c.id] || 0 })).filter(r => r.v > 0 || r.c.limit > 0);
  const unc = Object.keys(m.byCat).filter(id => !catOf(id)).reduce((s, id) => s + m.byCat[id], 0);
  if (unc) rows.push({ c: { id: '', name: 'Uncategorised', limit: 0 }, v: unc });
  if (rows.length) {
    const mx = Math.max(...rows.map(r => r.v), 1);
    h += `<div class="card"><div class="lbl">By category</div>` + rows.sort((a, b) => b.v - a.v).map(r => {
      const lim = r.c.limit, w = lim ? r.v / lim : r.v / mx, ov = lim && r.v > lim;
      return `<div style="margin-top:10px"><div class="row" style="font-size:14px"><span class="sp ell">${esc(r.c.name)}</span><span class="amt ${ov ? 'bad' : ''}">${fmtShort(r.v)}${lim ? ' / ' + fmtShort(lim) : ''} ₫</span></div><div class="bar"><i class="${ov ? 'over' : 'a2'}" style="width:${(clamp(w) * 100).toFixed(1)}%"></i></div></div>`;
    }).join('') + '</div>';
  }
  const gb = S.goals.filter(g => g.budget > 0 && !g.arch);
  if (gb.length) h += `<div class="card"><div class="lbl">Goal budgets · all time</div>` + gb.map(g => {
    const sp = goalSpent(g.id), ov = sp > g.budget;
    return `<div style="margin-top:10px" data-act="goalOpen" data-id="${g.id}"><div class="row" style="font-size:14px"><span class="sp ell">${esc(g.title)}</span><span class="amt ${ov ? 'bad' : ''}">${fmtShort(sp)} / ${fmtShort(g.budget)} ₫</span></div><div class="bar"><i class="${ov ? 'over' : ''}" style="width:${(clamp(sp / g.budget) * 100).toFixed(1)}%"></i></div></div>`;
  }).join('') + '</div>';
  if (m.out > 0) h += `<div class="card"><div class="row"><div class="sp"><div class="lbl">Outside budget</div><div class="sm" style="margin-top:3px">Big or one-off spending kept out of the monthly ring</div></div><b class="amt">${fmtShort(m.out)} ₫</b></div></div>`;
  const codes = Object.keys(S.settings.rates);
  h += `<div class="card"><div class="lbl">Converter</div><div class="srow"><input class="in" id="cvA" inputmode="decimal" placeholder="Amount" style="flex:1"><select class="in" id="cvC" style="width:100px">${codes.map(c => `<option>${c}</option>`).join('')}</select></div><div class="sm" id="cvOut" style="margin-top:8px">${codes.length ? '= 0 ₫' : 'Add exchange rates in Settings'}</div></div>`;
  const ex = S.expenses.filter(e => e.date.startsWith(ym)).sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created);
  h += `<div class="card"><div class="lbl">Spending</div>`;
  if (!ex.length) h += `<div class="empty">No spending logged in ${MONL[mo - 1]}.</div>`;
  let last = '';
  for (const e of ex) {
    if (e.date !== last) { h += `<div class="sec" style="margin-top:12px">${fmtDay(e.date)}</div>`; last = e.date; }
    const c = catOf(e.cat);
    h += `<div class="xrow" data-act="expEdit" data-id="${e.id}"><div class="sp"><div class="ell">${esc(e.note || (c ? c.name : 'Spending'))}</div><div class="sm">${esc(c ? c.name : 'Uncategorised')}${e.goal && goalOf(e.goal) ? ' · ' + esc(goalOf(e.goal).title) : ''}${e.out ? ' · outside budget' : ''}</div></div><div style="text-align:right"><div class="amt">${fmtVND(e.amt)}</div>${e.oc !== 'VND' ? `<div class="sm">${fmtNum(e.oa)} ${e.oc}</div>` : ''}</div></div>`;
  }
  return h + '</div>';
}

/* ---------- sheets ---------- */
function openSheet(title, body, opts = {}) {
  const w = document.createElement('div');
  w.className = 'sw';
  w.innerHTML = `<div class="scrim" data-act="sheetClose"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sh-head"><h3>${esc(title)}</h3><button class="x" data-act="sheetClose" aria-label="Close">✕</button></div><div class="sh-body">${body}</div></div>`;
  $('#sheets').appendChild(w);
  let pushed = false;
  try { history.pushState({ way: 'sheet', n: sheets.length + 1 }, ''); pushed = true; } catch (e) { /* history blocked */ }
  const sh = { el: w, pushed, refresh: opts.refresh || null, title };
  sheets.push(sh);
  document.body.style.overflow = 'hidden';
  return sh;
}
function topSheet() { return sheets[sheets.length - 1]; }
function closeSheets(n = 1) {
  n = Math.min(n, sheets.length); if (n <= 0) return;
  let hist = 0;
  for (let i = 0; i < n; i++) { const sh = sheets.pop(); if (sh.pushed) hist++; sh.el.remove(); }
  if (!sheets.length) document.body.style.overflow = '';
  if (hist) {
    const st = history.state;
    if (st && st.way === 'sheet') { ignorePop++; try { history.go(-hist); } catch (e) { ignorePop--; } }
  }
}
function closeAllSheets() { closeSheets(sheets.length); }
function refreshSheets() {
  for (const sh of sheets) if (sh.refresh) {
    const b = sh.el.querySelector('.sh-body'), top = b.scrollTop;
    try { const r = sh.refresh(); if (r === null) continue; b.innerHTML = r; b.scrollTop = top; }
    catch (e) { logDiag('sheet refresh: ' + e.message); }
  }
}
function F(name) { const t = topSheet(); return t ? t.el.querySelector(`[name="${name}"]`) : null; }
function V(name) { const f = F(name); return f ? f.value : ''; }
function showErr(msg) { const t = topSheet(); const e = t && t.el.querySelector('.err'); if (e) e.textContent = msg; else toast(msg); }
function confirmSheet(msg, okLabel, fn, danger = true) {
  pendingConfirm = fn;
  openSheet('Please confirm', `<p style="font-size:15px;line-height:1.45">${msg}</p><div class="btns"><button class="btn ${danger ? 'd' : ''}" data-act="confirmOk">${esc(okLabel)}</button><button class="btn g" data-act="sheetClose">Cancel</button></div>`);
}

/* ---------- import / export ---------- */
function stamp() { const d = new Date(); return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()); }
function backupJSON() { return JSON.stringify({ app: APP_ID, v: APP_V, exported: new Date().toISOString(), data: S }, null, 1); }
function markBackedUp() { S.meta.changes = 0; S.meta.lastBackup = Date.now(); save(); render(); rebuildSettings(); }
function download(name, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function showText(title, text) {
  openSheet(title, `<p class="sm">Downloading didn't work here. Copy this text and keep it somewhere safe; you can paste it into a .json file to import later.</p><textarea class="in" name="copytext" style="min-height:220px;font:12px var(--mono);margin-top:10px" readonly>${esc(text)}</textarea><div class="btns"><button class="btn" data-act="copyText">Copy</button></div>`);
}
function doExport() {
  const txt = backupJSON();
  try { download(`the-way-backup-${stamp()}.json`, txt, 'application/json'); markBackedUp(); toast('Backup downloaded'); }
  catch (e) { logDiag('export: ' + e.message); showText('Backup text', txt); markBackedUp(); }
}
async function doShare() {
  const txt = backupJSON(), name = `the-way-backup-${stamp()}.json`;
  try {
    const file = new File([txt], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'The Way backup' });
      markBackedUp(); toast('Backup shared'); return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; logDiag('share: ' + (e && e.message)); }
  toast('Sharing isn’t available here, so downloading instead'); doExport();
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('Copied'); return; } catch (e) { /* fallback */ }
  const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('Copied'); } catch (e) { toast('Copy failed; select the text manually'); }
  ta.remove();
}
function csvCell(v) { const s = String(v == null ? '' : v); return /[",\n\r]/.test(s) || /^[=+\-@]/.test(s) ? '"' + (/^[=+\-@]/.test(s) ? "'" : '') + s.replace(/"/g, '""') + '"' : s; }
function doCSV(kind) {
  let rows;
  if (kind === 'task') {
    rows = [['title', 'due', 'priority', 'done', 'done_on', 'area', 'goal', 'note']].concat(S.tasks.map(t => [t.title, t.due, ['', 'low', 'normal', 'high'][t.prio], t.done ? 'yes' : 'no', t.doneAt, areaOf(t.area) ? areaOf(t.area).name : '', goalOf(t.goal) ? goalOf(t.goal).title : '', t.note]));
  } else {
    rows = [['date', 'amount_vnd', 'original_amount', 'currency', 'category', 'goal', 'outside_budget', 'note']].concat([...S.expenses].sort((a, b) => a.date.localeCompare(b.date)).map(e => [e.date, e.amt, e.oa, e.oc, catOf(e.cat) ? catOf(e.cat).name : '', goalOf(e.goal) ? goalOf(e.goal).title : '', e.out ? 'yes' : 'no', e.note]));
  }
  const txt = '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  try { download(`the-way-${kind === 'task' ? 'tasks' : 'spending'}-${stamp()}.csv`, txt, 'text/csv'); toast('CSV downloaded'); }
  catch (e) { showText('CSV text', txt); }
}
function counts(d) { return `${d.goals.length} goals, ${d.systems.length} systems, ${d.tasks.length} tasks, ${d.expenses.length} spending entries`; }
function handleImportText(text) {
  if (text.length > 20e6) return importFail('This file is too large to be a backup from The Way.');
  let obj;
  try { obj = JSON.parse(text); } catch (e) { return importFail('This file isn’t valid JSON, so it can’t be imported. Nothing was changed.'); }
  if (!isObj(obj) || obj.app !== APP_ID || !isObj(obj.data)) return importFail('This file is not a backup from The Way (it may belong to another tool). Nothing was changed.');
  const data = sanitizeState(obj.data);
  pendingImport = data;
  const nw = k => data[k].filter(x => !S[k].some(y => y.id === x.id)).length;
  const exp = typeof obj.exported === 'string' && !isNaN(Date.parse(obj.exported)) ? fmtDay(keyOf(new Date(obj.exported)), true) : 'unknown date';
  openSheet('Import backup', `<p style="font-size:15px">Backup from <b>${esc(exp)}</b> contains ${counts(data)}.</p>
    <div class="group"><div class="lbl">Merge</div><p class="sm" style="margin-top:6px">Adds what's new and keeps everything you have, updating items that were changed more recently in the backup: ${nw('goals')} goals, ${nw('systems')} systems, ${nw('tasks')} tasks, ${nw('expenses')} spending entries are new.</p><div class="btns"><button class="btn" data-act="impMerge">Merge</button></div></div>
    <div class="group"><div class="lbl">Replace</div><p class="sm" style="margin-top:6px">Replaces everything on this phone with the backup. Current data (${counts(S)}) will be gone${SC.on ? ', on your other synced devices too' : ''}.</p><div class="btns"><button class="btn d" data-act="impReplace">Replace all</button></div></div>`);
}
function importFail(msg) { openSheet('Can’t import', `<p style="font-size:15px">${esc(msg)}</p><div class="btns"><button class="btn g" data-act="sheetClose">OK</button></div>`); }
function mergeData(data, upd) {
  let added = 0, updated = 0;
  for (const k of ['goals', 'systems', 'tasks', 'expenses', 'areas', 'cats']) {
    const at = new Map(S[k].map((x, i) => [x.id, i]));
    for (const x of data[k]) {
      if (!at.has(x.id)) { S[k].push(x); added++; }
      else if (upd && (x.u || 0) > (S[k][at.get(x.id)].u || 0)) { S[k][at.get(x.id)] = x; updated++; }
    }
  }
  for (const [c, v] of Object.entries(data.settings.rates)) if (!(c in S.settings.rates)) S.settings.rates[c] = v;
  return upd ? { added, updated } : added;
}

const A = {

  addType(el) {

    t.el.querySelectorAll('#addSeg button').forEach(b => b.classList.toggle('on', b === el));
    t.el.querySelector('#addForm').innerHTML = addForm(el.dataset.v, {});
  },
  welcomeDone() { S.meta.welcomed = true; commit(); },
  examples() { const n = loadExamples(); commit(n ? 'Examples added' : 'Examples are already here'); rebuildSettings(); },
  exNoteOff() { S.meta.exNote = false; save(); render(); },
  examplesDel() {
    confirmSheet('Remove all example goals, systems, tasks and spending? Your own items are kept.', 'Remove examples', () => {
      for (const k of ['goals', 'systems', 'tasks', 'expenses']) S[k] = S[k].filter(x => !x.id.startsWith('ex-'));
      S.meta.exNote = false; if (S.meta.focus.startsWith('ex-')) S.meta.focus = '';
      closeSheets(1); commit('Examples removed'); rebuildSettings();
    }, false);
  },
  focusNext() {
    const st = activeGoals().filter(g => g.star), pool = st.length ? st : activeGoals();
    if (pool.length < 2) { const g = focusGoal(); if (g) A.goalOpen({ dataset: { id: g.id } }); return; }
    const cur = focusGoal(), i = pool.findIndex(g => g.id === (cur && cur.id));
    S.meta.focus = pool[(i + 1) % pool.length].id; save(); render();
  },
  /* now / next */
  nowDone() {
    const I = nowInfo(); if (!I.cur) return render();
    setDone(I.cur.s, I.k, 1);
    S.meta.manual = { date: I.k, idx: I.i + 1 };
    commit(I.next ? 'Done · next: ' + I.next.s.title : 'Done · that was the last block');
  },
  nowStart() { const I = nowInfo(); if (!I.next) return render(); S.meta.manual = { date: I.k, idx: I.nextIdx }; commit(); },
  nowClock() { S.meta.manual = null; commit(); },
  /* systems */
  sysOpen(el) { const id = el.dataset.id; if (!byId(S.systems, id)) return; const s = byId(S.systems, id); openSheet(s.title, sysDetail(id), { refresh: () => sysDetail(id) }); },
  sysToggle(el) { const s = byId(S.systems, el.dataset.id); if (!s) return; const k = todayKey(); const d = !isDone(s, k); setDone(s, k, d); commit(d ? 'Done · ' + s.title : ''); },
  stepToggle(el) {
    const s = byId(S.systems, el.dataset.id); if (!s) return; const k = todayKey();
    const e = s.log[k] || { d: 0, s: [] }; const st = el.dataset.st;

function numChange(el, add) {
  const g = goalOf(el.dataset.id); if (!g) return;
  const v = parseAmt(String(V('numv')).replace(/^\+/, ''));
  const neg = /^\s*-/.test(V('numv'));
  if (!Number.isFinite(v) && !neg) return showErr('Type a number, e.g. 2 or 5m.');
  const val = neg ? -parseAmt(V('numv').replace(/^\s*-/, '')) : v;
  if (!Number.isFinite(val)) return showErr('Type a number, e.g. 2 or 5m.');
  g.cur = add ? g.cur + val : val; g.cur = Math.max(-1e15, Math.min(1e15, g.cur)); g.updated = Date.now();
  commit(g.target && g.cur >= g.target ? 'Target reached. Well walked.' : 'Updated');
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  try { fn(el, e); } catch (err) { logDiag(el.dataset.act + ': ' + (err && err.message)); toast('Something went wrong; it was logged in Settings'); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'cvA' || t.id === 'cvC') {
    const a = parseAmt($('#cvA').value), c = $('#cvC').value, r = S.settings.rates[c];
    $('#cvOut').textContent = Number.isFinite(a) && r ? `${fmtNum(a)} ${c} = ${fmtVND(a * r)}` : '= 0 ₫';
  }
  if (t.name === 'amount' || t.name === 'cur') {
    const sh = topSheet(); const p = sh && sh.el.querySelector('#expPrev'); if (!p) return;
    const a = parseAmt(V('amount')), c = V('cur'), r = c === 'VND' ? 1 : S.settings.rates[c];
    p.textContent = Number.isFinite(a) && a > 0 && r ? '= ' + fmtVND(a * r) : 'Tip: 65k = 65,000 · 1.2m = 1,200,000';
  }
});
document.addEventListener('change', e => { if (e.target.name === 'cur') e.target.dispatchEvent(new Event('input', { bubbles: true })); });

function onPop() {
  if (ignorePop > 0) { ignorePop--; return; }
  if (!sheets.length && watchBack()) return;
  if (sheets.length) { const sh = sheets.pop(); sh.el.remove(); if (!sheets.length) document.body.style.overflow = ''; return; }
  if (Date.now() - guardTime < 2500) { guardTime = 0; try { history.back(); } catch (e) { /* ignore */ } return; }
  guardTime = Date.now();
  try { history.pushState({ way: 'guard' }, ''); } catch (e) { /* ignore */ }
  toast('Swipe back again to leave', 2500);
}
function markVis(v) { lsSet(LS_VIS, JSON.stringify({ vis: v, t: Date.now() })); }
function isTyping() { const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); }

/* ---------- init ---------- */
function init() {
  storageProbe();
  const firstRun = lsGet(LS_KEY) === null;
  S = loadState();
  takeSnap(); loadSC();
  if (firstRun) { loadExamples(); S.meta.changes = 0; save(); }
  // the-way.html#watch or #phone switches this device's view (handy when auto-detect guesses wrong)
  const hv = { '#watch': 'on', '#phone': 'off', '#auto': 'auto' }[String(location.hash).toLowerCase()];
  if (hv) { S.settings.watch = hv; save(); try { history.replaceState(history.state, '', location.pathname + location.search); } catch (e) { /* ignore */ } }
  try {
    const vis = JSON.parse(lsGet(LS_VIS) || 'null');
    if (vis && vis.vis === 1 && Date.now() - vis.t < 10 * 60e3 && !S.settings.lite) {
      S.settings.lite = true; liteAuto = true; save();
      logDiag('Last session closed unexpectedly while open; Lite mode switched on');
    }
  } catch (e) { /* ignore */ }
  markVis(1);
  pickTheme();
  document.body.innerHTML = `<header class="hd" id="hd"><img id="scene" alt=""><div class="hd-top"><div class="stamp"><b>道</b><span>The Way</span><button id="sdot" class="sdot s-off hidden" data-act="syncOpen" aria-label="Sync status"></button></div><button class="hbtn" data-act="settings" aria-label="Settings">${IC.gear}</button></div><div class="hd-main" id="hdMain"></div></header>
  <main class="wrap" id="main"></main>
  <nav class="tabs"><button class="tab" data-act="tab" data-tab="today">${IC.today}Today</button><button class="tab" data-act="tab" data-tab="systems">${IC.systems}Systems</button><div class="fabw"><button class="fab" data-act="add" aria-label="Add">${IC.plus}</button></div><button class="tab" data-act="tab" data-tab="tasks">${IC.tasks}Tasks</button><button class="tab" data-act="tab" data-tab="goals">${IC.goals}Goals</button><button class="tab" data-act="tab" data-tab="budget">${IC.budget}Budget</button></nav>

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
'use strict';
/* ===== watch.js — ring hub for a round watch screen =====

Object.assign(ui, { w: 'home', wAmt: '', wPin: '', wArm: 0 });

function isWatch() {
  const m = S && S.settings.watch;
  if (m === 'on') return true;
  if (m === 'off') return false;
  const w = window.innerWidth || 0, h = window.innerHeight || 0, big = Math.max(w, h);

function watchColors() {

  r.setProperty('--wac2', mix(t.ac2, '#FFFFFF', 0.3));

function wGo(screen) {

}
/* called first by onPop: swipe-back inside the watch view goes Home */
function watchBack() {

}
function watchSyncChanged() {
  if (!isWatch()) return;

/* ---------- screens ---------- */
function wRing(p, color) {
  const C = 2 * Math.PI * 47;
  return `<svg class="wring" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><circle cx="50" cy="50" r="47" stroke="#2A3440" stroke-width="2.4" fill="none"/>` +
    (p > 0 ? `<circle cx="50" cy="50" r="47" stroke="${color}" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-dasharray="${(C * clamp(p)).toFixed(2)} ${C.toFixed(2)}" transform="rotate(-90 50 50)"/>` : '') + '</svg>';
}
function wTop() {
  const n = now();
  return `<button class="wtop" data-act="wGo" data-v="set" aria-label="Settings and sync">${pad(n.getHours())}:${pad(n.getMinutes())}${SC.on ? `<span class="sdot s-${SY.st}"></span>` : '<span style="font-size:4vmin">⚙</span>'}</button>`;
}
function wHomeView() {
  const t = todayStats(), I = nowInfo();
  let lab, title, btn = '';
  if (I.cur) {
    const done = isDone(I.cur.s, I.k);
    lab = I.mode === 'clock' ? 'Now · ' + fmtMin(I.cur.end - I.nm) + ' left' : 'Now · started';
    title = I.cur.s.title;

  } else if (I.next) {
    lab = 'Next ' + I.next.s.time + ' · in ' + fmtMin(I.next.start - I.nm);
    title = I.next.s.title;
    btn = `<button class="wbtn g" data-act="nowStart">Start now</button>`;
  } else {
    const n = now();
    lab = DOW[n.getDay()] + ' ' + n.getDate() + ' ' + MON[n.getMonth()];
    title = I.B.length ? (I.B.every(b => isDone(b.s, I.k)) ? 'All blocks done' : 'Blocks are over') : (t.total && t.left === 0 ? 'All done today' : 'A calm day');
  }
  const sub = t.total ? `${t.done} of ${t.total} done today${t.overdue ? ` · <span class="wbad">${t.overdue} late</span>` : ''}` : 'Nothing due today';
  const back = I.mode === 'manual' ? `<button class="wsub" data-act="nowClock" style="text-decoration:underline">back to clock</button>` : '';
  return wRing(t.total ? t.done / t.total : 0, 'var(--wac)') + wTop() +
    `<div class="wv"><div class="wc mid"><div class="wlab">${esc(lab)}</div><div class="wbig" style="margin-top:1.4vmin">${esc(title)}</div><div class="wsub">${sub}</div>
    <div class="wbtns">
      <button class="wrb" data-act="wGo" data-v="sys" aria-label="Systems">${IC.systems}</button>
      <button class="wrb" data-act="wGo" data-v="tasks" aria-label="Tasks">${IC.tasks}</button>
      <button class="wrb hot" data-act="wGo" data-v="spend" aria-label="Add spending">${IC.plus}</button>
      <button class="wrb" data-act="wGo" data-v="budget" aria-label="Budget">₫</button>
    </div>${btn}${back}</div></div>`;
}
function wHead(txt) { return `<button class="whead" data-act="wHome"><b>‹</b>${esc(txt)}</button>`; }
function wSysView() {
  const k = todayKey();
  const list = S.systems.filter(s => scheduledOn(s, k)).sort((a, b) => (a.time ? 0 : 1) - (b.time ? 0 : 1) || (a.time || '').localeCompare(b.time || '') || a.title.localeCompare(b.title));
  const dn = list.filter(s => isDone(s, k)).length;
  let h = wHead(list.length ? `Systems · ${dn} of ${list.length}` : 'Systems');
  if (!list.length) h += `<div class="wempty">Nothing scheduled today.</div>`;
  for (const s of list) {
    const d = isDone(s, k);
    h += `<button class="wrow${d ? ' dn' : ''}" data-act="sysToggle" data-id="${s.id}"><span class="wck${d ? ' on' : ''}"></span><span class="t">${esc(s.title)}<span class="s">${s.time ? esc(s.time) : 'Anytime'}</span></span></button>`;
  }
  return `<div class="wv"><div class="wc">${h}</div></div>`;
}
function wTaskView() {
  const k = todayKey();
  const open = S.tasks.filter(t => !t.done).sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || b.prio - a.prio || a.created - b.created);
  const late = open.filter(t => t.due && t.due < k), today = open.filter(t => t.due === k);
  const soon = open.filter(t => !t.due || t.due > k).slice(0, 8);
  const doneToday = S.tasks.filter(t => t.done && t.doneAt === k);
  const row = t => `<button class="wrow${t.done ? ' dn' : ''}" data-act="taskToggle" data-id="${t.id}"><span class="wck sq${t.done ? ' on' : ''}"></span><span class="t">${esc(t.title)}${t.due && t.due > k ? `<span class="s">${esc(dueLabel(t).txt)}</span>` : ''}</span></button>`;
  let h = wHead(`Tasks · ${open.length} open`);
  if (!open.length && !doneToday.length) h += `<div class="wempty">All clear.</div>`;
  if (late.length) h += `<div class="wsec bad">Late</div>` + late.map(row).join('');
  if (today.length) h += `<div class="wsec">Today</div>` + today.map(row).join('');
  if (doneToday.length) h += `<div class="wsec">Done today</div>` + doneToday.map(row).join('');
  if (soon.length) h += `<div class="wsec">Later</div>` + soon.map(row).join('');

}
function wPad(act) {
  const k = ['1', '2', '3', 'del', '4', '5', '6', '0', '7', '8', '9', act === 'wKey' ? '000' : ''];
  return `<div class="wpad">${k.map(v => v === '' ? '<span></span>' : `<button class="${v === '000' ? 'sm' : ''}" data-act="${act}" data-v="${v}" aria-label="${v === 'del' ? 'Delete' : v}">${v === 'del' ? '⌫' : v}</button>`).join('')}</div>`;
}
function wSpendView() {
  const n = Number(ui.wAmt || 0);
  return `<div class="wv"><div class="wc" style="padding-top:11vmin">${wHead('Spend')}
    <div class="wamt">${n ? n.toLocaleString('en-US') : '0'} <i>₫</i></div>${wPad('wKey')}
    <button class="wbtn a2" data-act="wNext" ${n > 0 ? '' : 'disabled'}>Next ›</button></div></div>`;
}
function wCatView() {
  const n = Number(ui.wAmt || 0);
  return `<div class="wv"><div class="wc">${wHead(n.toLocaleString('en-US') + ' ₫ · for?')}
    <div class="wgrid">${S.cats.map(c => `<button data-act="wCat" data-id="${c.id}">${esc(c.name)}</button>`).join('')}</div></div></div>`;
}
function wBudgetView() {
  const k = todayKey(), ym = monthKey(k), m = monthStats(ym);
  const over = m.budget > 0 && m.spent > m.budget, p = m.budget > 0 ? m.spent / m.budget : 0;
  const todays = S.expenses.filter(e => e.date === k && !e.out);
  const tSum = todays.reduce((a, e) => a + e.amt, 0);
  const last = [...S.expenses].filter(e => e.date === k).sort((a, b) => b.created - a.created)[0];
  let h = wHead('Budget · ' + MON[Number(ym.slice(5)) - 1]);
  h += m.budget > 0
    ? `<div class="wamt ${over ? 'wbad' : ''}" style="margin-top:2vmin">${fmtShort(Math.abs(m.left))} <i>₫</i></div><div class="wsub" style="margin-top:-1.5vmin">${over ? 'over budget' : 'left · ' + fmtShort(m.perDay) + ' a day'}</div>`
    : `<div class="wempty">No monthly budget set. Set one on your phone.</div>`;
  h += `<div style="margin-top:4vmin"><div class="wkv"><span>Today</span><b>${fmtShort(tSum)} ₫</b></div><div class="wkv"><span>This month</span><b>${fmtShort(m.spent)} ₫</b></div>${m.budget > 0 ? `<div class="wkv"><span>Budget</span><b>${fmtShort(m.budget)} ₫</b></div>` : ''}</div>`;
  if (last) {
    const c = catOf(last.cat);
    h += `<div class="wnote" style="margin-top:4vmin">Last: ${fmtShort(last.amt)} ₫${c ? ' · ' + esc(c.name) : ''}</div>
      <button class="wbtn d" data-act="wUndo" data-id="${last.id}">${ui.wArm === last.id ? 'Tap again to remove' : 'Remove last'}</button>`;
  }
  return wRing(p, over ? '#F28B7D' : 'var(--wac2)') + `<div class="wv"><div class="wc">${h}</div></div>`;

function wSetView() {
  let h = wHead(SC.on ? 'Settings' : 'Connect sync');
  if (!SC.on) {
    const canSync = !!apiBase();
    if (pendingCloud) {
      h += `<div class="wnote">This watch already has its own data. Merge it with the cloud, or use the cloud copy?</div>
        <button class="wbtn" data-act="wChoose" data-v="merge">Merge both</button><button class="wbtn g" data-act="wChoose" data-v="cloud">Use cloud copy</button>`;
    } else if (!canSync) {
      h += `<div class="wnote">Open this tool from your sync site to sync on the watch.</div>`;
    } else {
      h += `<div class="wnote" style="margin-top:0">Sync PIN</div><div class="wdots">${[0, 1, 2, 3].map(i => `<i class="${i < ui.wPin.length ? 'on' : ''}"></i>`).join('')}</div>${wPad('wPinKey')}
        <button class="wbtn" data-act="wConnect" ${ui.wPin.length >= 4 ? '' : 'disabled'}>Connect</button>`;
      if (SY.msg && SY.st !== 'ok') h += `<div class="wnote wbad">${esc(SY.msg)}</div>`;
    }
  } else if (SY.st === 'pin') {
    h += `<div class="wnote wbad">${esc(SY.msg || 'PIN not accepted')}</div><div class="wdots">${[0, 1, 2, 3].map(i => `<i class="${i < ui.wPin.length ? 'on' : ''}"></i>`).join('')}</div>${wPad('wPinKey')}
      <button class="wbtn" data-act="wPinRetry" ${ui.wPin.length >= 4 ? '' : 'disabled'}>Try PIN</button>`;
  } else {
    h += `<div class="wlab" style="margin-top:2vmin">Cloud sync</div><div class="wnote" style="color:var(--wink)">${esc(syncLine())}</div>

      <button class="wbtn" data-act="syncNowBtn">Sync now</button>`;
  }
  h += `<button class="wbtn g" data-act="wPhone" style="margin-top:6vmin">Phone view</button><div class="wnote">To come back, choose Watch view in the phone settings.</div>`;

function renderWatch() {
  watchColors();
  let w = document.getElementById('watch');
  if (!w) { w = document.createElement('div'); w.id = 'watch'; document.body.insertBefore(w, document.body.firstChild); }
  const V = { home: wHomeView, sys: wSysView, tasks: wTaskView, spend: wSpendView, cat: wCatView, budget: wBudgetView, set: wSetView }[ui.w] || wHomeView;
  const v = w.querySelector('.wv'), top = v ? v.scrollTop : 0, same = w.dataset.screen === ui.w;
  w.innerHTML = V(); w.dataset.screen = ui.w;
  const nv = w.querySelector('.wv'); if (nv && same) nv.scrollTop = top;
}

/* ---------- actions ---------- */
Object.assign(A, {
  wGo(el) { if (el.dataset.v === 'spend') ui.wAmt = ''; if (el.dataset.v === 'set') ui.wPin = ''; wGo(el.dataset.v); },
  wHome() { ui.wAmt = ''; ui.wPin = ''; wHome(); },
  wKey(el) {
    const v = el.dataset.v;
    if (v === 'del') ui.wAmt = ui.wAmt.slice(0, -1);
    else if ((ui.wAmt + v).replace(/^0+/, '').length <= 12) ui.wAmt = (ui.wAmt + v).replace(/^0+/, '');
    render();
  },
  wNext() { if (Number(ui.wAmt) > 0) { ui.w = 'cat'; render(); } },
  wCat(el) {
    const amt = Math.round(Number(ui.wAmt)); if (!(amt > 0) || amt > 1e13) return wGo('spend');
    const c = catOf(el.dataset.id);
    S.expenses.push({ id: uid('e'), date: todayKey(), amt, oa: amt, oc: 'VND', cat: c ? c.id : '', goal: '', note: '', out: false, created: Date.now() });
    ui.wAmt = '';
    commit('Added ' + fmtShort(amt) + ' ₫' + (c ? ' · ' + c.name : ''));
    wHome();
  },
  wUndo(el) {
    const id = el.dataset.id;
    if (ui.wArm !== id) { ui.wArm = id; render(); setTimeout(() => { if (ui.wArm === id) { ui.wArm = 0; if (isWatch()) render(); } }, 4000); return; }
    ui.wArm = 0; S.expenses = S.expenses.filter(e => e.id !== id); commit('Removed');
  },
  wPinKey(el) {
    const v = el.dataset.v;
    if (v === 'del') ui.wPin = ui.wPin.slice(0, -1); else if (ui.wPin.length < 8) ui.wPin += v;
    render();
  },
  async wConnect(el) {
    const pin = ui.wPin; if (!/^\d{4,8}$/.test(pin)) return;
    el.disabled = true; el.textContent = 'Connecting…';
    try {
      const r = await connectSync(pin, '');
      ui.wPin = '';
      if (r === 'ask') return render();
      SY.msg = ''; syncNow(true); toast(r === 'took' ? 'Connected · your data is here' : 'Connected', 2500); render();
    } catch (e) { ui.wPin = ''; SY.msg = syncErrText(e); render(); }
  },
  wChoose(el) { if (!pendingCloud) return render(); finishConnect(el.dataset.v); syncNow(true); toast('Connected', 2000); render(); },
  wPinRetry() { if (!/^\d{4,8}$/.test(ui.wPin)) return; SC.pin = ui.wPin; ui.wPin = ''; saveSC(); syncNow(true); render(); },
  wPhone() { S.settings.watch = 'off'; save(); ui.w = 'home'; render(); },
  watchMode(el) { S.settings.watch = el.dataset.v; save(); ui.w = 'home'; if (isWatch()) closeAllSheets(); render(); rebuildSettings(); toast(el.dataset.v === 'on' ? 'Watch view on' : el.dataset.v === 'off' ? 'Phone view' : 'Watch view picks itself by screen size'); }
});
